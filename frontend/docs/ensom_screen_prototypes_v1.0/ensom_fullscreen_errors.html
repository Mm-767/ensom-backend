<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ensom — 전면 오류·차단 화면 프로토타입</title>
<style>
  :root{
    --lime:#c6f135;--ink:#14150f;--ink-muted:#63655e;--ink-faint:#6f7269;
    --surface-2:#eef0ea;--cta:#1f231a;--hairline:#e3e5e0;
    --font:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--font);background:#d9dcd3;color:var(--ink);padding:32px 20px 60px;-webkit-font-smoothing:antialiased;}
  .page-head{max-width:1180px;margin:0 auto 22px;}
  .page-head h1{font-size:22px;font-weight:700;letter-spacing:-.4px;}
  .page-head p{font-size:13px;color:#55584f;margin-top:6px;line-height:1.55;}
  .stage{max-width:1180px;margin:0 auto;display:flex;gap:36px;flex-wrap:wrap;align-items:flex-start;}
  .phone{width:344px;height:730px;flex:0 0 auto;background:#fff;border-radius:46px;border:9px solid #16170f;position:relative;overflow:hidden;box-shadow:0 20px 50px rgba(20,21,15,.26);}
  .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:112px;height:26px;background:#16170f;border-radius:0 0 16px 16px;z-index:60;}

  .selrow{position:absolute;top:8px;left:0;right:0;display:flex;flex-wrap:wrap;gap:4px;justify-content:center;padding:0 12px;z-index:99;}
  .selrow button{font-family:var(--font);font-size:10px;font-weight:700;border:0;border-radius:999px;padding:6px 9px;background:var(--surface-2);color:var(--ink-muted);cursor:pointer;}
  .selrow button.on{background:var(--cta);color:#fff;}

  .view{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:0 32px;text-align:center;}
  .view.on{display:flex;}
  .icowrap{width:56px;height:56px;border-radius:999px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;margin-bottom:20px;}
  .icowrap svg{width:24px;height:24px;stroke:var(--ink-muted);fill:none;stroke-width:1.8;}
  .view h2{font-size:19px;font-weight:700;letter-spacing:-.3px;margin-bottom:9px;}
  .view p{font-size:12.5px;color:var(--ink-muted);line-height:1.6;word-break:keep-all;}
  .pbtn{font-family:var(--font);border:0;border-radius:999px;padding:12px 22px;font-size:13px;font-weight:700;cursor:pointer;margin-top:22px;}
  .pbtn.primary{background:var(--cta);color:#fff;}
  .pbtn.secondary{background:var(--surface-2);color:var(--ink);}

  .hint{display:inline-block;background:#15170f;color:#c6f135;font-size:11.5px;font-weight:600;padding:6px 12px;border-radius:999px;margin-top:10px;}
  .legend{max-width:340px;font-size:12px;color:#55584f;line-height:1.7;}
  .legend b{color:var(--ink);}

  /* ═ embed mode (used when loaded inside ensom_master_flow.html) ═ */
  body.embed{background:transparent;padding:0;overflow:hidden;}
  body.embed .page-head,body.embed .legend,body.embed .hint{display:none!important;}
  body.embed .stage{margin:0;padding:0;gap:0;}
  body.embed{height:100vh;}
  body.embed .stage{height:100%;align-items:stretch;}
  body.embed .phone{width:100%!important;height:100%!important;max-width:100%;border:0!important;border-radius:0!important;box-shadow:none!important;}
  body.embed .notch{display:none!important;}
</style>
</head>
<body>

<div class="page-head">
  <h1>Ensom — 전면 오류·차단 화면 4종 프로토타입</h1>
  <p>네트워크 없음 / 세션 만료 / 점검 중 / 업데이트 필요. 하단 탭바 없이, 여백 위주로 담백하게.</p>
</div>

<div class="stage">
  <div class="phone">
    <div class="notch"></div>
    <div class="selrow">
      <button class="on" onclick="show(0,this)">네트워크 없음</button>
      <button onclick="show(1,this)">세션 만료</button>
      <button onclick="show(2,this)">점검 중</button>
      <button onclick="show(3,this)">업데이트 필요</button>
    </div>

    <div class="view on" id="v0">
      <div class="icowrap"><svg viewBox="0 0 24 24"><path d="M2 8.5s4-4 10-4 10 4 10 4M5.5 12s3-3 6.5-3 6.5 3 6.5 3M9 15.5s1.5-1.5 3-1.5 3 1.5 3 1.5"/><circle cx="12" cy="19" r="1"/></svg></div>
      <h2>연결을 확인해 주세요</h2>
      <p>인터넷에 연결되면 자동으로 다시 시도할게요</p>
      <button class="pbtn secondary">다시 시도</button>
    </div>

    <div class="view" id="v1">
      <div class="icowrap"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg></div>
      <h2>다시 로그인해 주세요</h2>
      <p>보안을 위해 로그인이 만료되었어요</p>
      <button class="pbtn primary">로그인</button>
    </div>

    <div class="view" id="v2">
      <div class="icowrap"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.1-3.1a5 5 0 01-6.6 6.6L6.4 20.6a2 2 0 01-2.8-2.8L11.4 10a5 5 0 016.6-6.6l-3 3z"/></svg></div>
      <h2>잠시 점검 중이에요</h2>
      <p>오후 3시쯤 다시 이용하실 수 있어요</p>
    </div>

    <div class="view" id="v3">
      <div class="icowrap"><svg viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/></svg></div>
      <h2>새 버전이 필요해요</h2>
      <p>계속 사용하려면 업데이트해 주세요</p>
      <button class="pbtn primary">업데이트</button>
    </div>
  </div>

  <div class="legend">
    <p><b>공통 원칙</b> — 사과 문구("죄송합니다") 금지, 경고 아이콘·느낌표·빨강 없음, 하단 탭바 없음.</p>
    <div class="hint">4개 상태 칩으로 전환</div>
  </div>
</div>

<script>
  function show(i, btn){
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
    document.getElementById('v'+i).classList.add('on');
    document.querySelectorAll('.selrow button').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
  }
</script>

<script>(function(){ if(window.self!==window.top){ document.body.classList.add('embed'); } })();</script>

</body>
</html>
